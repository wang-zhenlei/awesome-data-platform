name: Refresh awesome list

  on:
    schedule:
      # 每天 17:00 UTC = 北京时间次日 01:00 刷新
      - cron: '0 17 * * *'
    workflow_dispatch:  # 手动触发

  permissions:
    contents: write

  jobs:
    refresh:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      steps:
        - uses: actions/checkout@v4

        - name: Setup gh CLI
          run: |
            gh auth setup-git
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Run refresh script
          run: |
            python3 scripts/refresh.py
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH: gh
            REPO: ${{ github.repository }}
            OUT: repo-out

        - name: Generate daily insight report
          run: |
            python3 scripts/daily_insight.py
          env:
            OUT: repo-out
            REPORT_DIR: 日报
            STATE: scripts/state/snapshot.json
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            INSIGHT_MODEL: claude-haiku-5-5

        - name: Commit & push changes
          run: |
            mkdir -p topics 日报 scripts/state
            cp -f repo-out/README.md ./README.md
            cp -rf repo-out/topics/* ./topics/
            rm -rf repo-out
            git config core.quotepath false
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md topics 日报 scripts/state
            git rm -r --cached --ignore-unmatch repo-out
            if git diff --cached --quiet; then
              echo "无变化，跳过提交"
            else
              git commit -m "chore: 自动刷新 + 每日洞察 ($(date -u +%Y-%m-%d))"
              git push
            fi
